name: Release installer

# Push a tag such as v0.2.0 (or v0.3.0-beta.1 for a pre-release), or run the workflow by hand with a version.
# It builds Refract-Setup-<version>.exe and publishes it, with its checksum, as a GitHub release.
# The in-app updater (Settings > Updates) reads that release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 or 0.3.0-beta.1 (creates the tag v<version> on the selected commit)"
        required: true
        type: string
      with_render:
        description: "Bundle Mitsuba 3 so Render picture and the photoreal view work (adds several hundred MB)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          $v = $v.Trim().TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.\-]+)?$') { throw "Not a version number: '$v' (use 1.2.3 or 1.2.3-beta.1)" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          "prerelease=$($v.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            packaging/requirements-build.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build the installer
        shell: pwsh
        run: |
          $p = @{ Version = "${{ steps.ver.outputs.version }}" }
          # Mitsuba is bundled by default (tag pushes have no inputs); only an explicit "false" from a manual run skips it.
          if ("${{ inputs.with_render }}" -ne "false") { $p.WithRender = $true }
          .\packaging\build.ps1 @p

      - name: Check the installer
        shell: pwsh
        run: |
          $setup = "dist-installer\Refract-Setup-${{ steps.ver.outputs.version }}.exe"
          if (-not (Test-Path $setup)) { throw "$setup was not built" }
          Get-ChildItem dist-installer | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Refract-Setup-${{ steps.ver.outputs.version }}
          path: dist-installer/Refract-Setup-*.exe*
          if-no-files-found: error

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $files = @(Get-ChildItem "dist-installer\Refract-Setup-*.exe*" | ForEach-Object FullName)
          $flags = @("--title", "Refract $($tag.TrimStart('v'))", "--generate-notes")
          if ("${{ steps.ver.outputs.prerelease }}" -eq "true") { $flags += "--prerelease" }
          if (gh release view $tag 2>$null) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files @flags --target "${{ github.sha }}"
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
